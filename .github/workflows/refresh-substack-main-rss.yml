name: Refresh Substack main RSS

on:
  push:
    paths:
      - 'shorts/**'
      - 'source/**'
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Substack RSS
        run: |
          mkdir -p resource
          curl -fL --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 GitHub-Actions RSS Sync' \
            'https://soutame.substack.com/feed' \
            -o resource/substack-main-feed.rss.tmp
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('resource/substack-main-feed.rss.tmp')
          PY
          mv resource/substack-main-feed.rss.tmp resource/substack-main-feed.rss

      - name: Commit changed feed
        run: |
          if git diff --quiet -- resource/substack-main-feed.rss; then
            echo 'RSS unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resource/substack-main-feed.rss
          git commit -m 'Refresh Substack main RSS snapshot'
          git push
