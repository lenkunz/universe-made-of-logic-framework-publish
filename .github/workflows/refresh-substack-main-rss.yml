name: Refresh Substack main RSS

on:
  push:
    paths:
      - 'shorts/**'
      - 'source/**'
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch RSS
        shell: bash
        run: |
          mkdir -p resource
          tmp='resource/substack-main-feed.rss.tmp'
          feed='resource/substack-main-feed.rss'
          status='resource/substack-main-feed.status.json'
          url='https://souta.me/rss/feed'
          rm -f "$tmp"

          http_status=$(curl -L -sS -o "$tmp" -w '%{http_code}' "$url")
          curl_exit=$?
          state='fetch-failed'
          message='RSS fetch failed.'

          if [ "$curl_exit" -eq 0 ] && [ "$http_status" = '200' ] && [ -s "$tmp" ]; then
            if python -c "import sys, xml.etree.ElementTree as ET; root=ET.parse(sys.argv[1]).getroot(); tag=root.tag.lower(); sys.exit(0 if tag.endswith('rss') or tag.endswith('feed') else 1)" "$tmp"; then
              mv "$tmp" "$feed"
              state='ok'
              message='RSS refreshed successfully.'
            else
              rm -f "$tmp"
              state='validation-failed'
              message='HTTP 200 received, but response was not valid RSS/Atom XML. Previous snapshot preserved.'
            fi
          else
            rm -f "$tmp"
            message="HTTP ${http_status}; curl exit ${curl_exit}. Previous good snapshot preserved."
          fi

          printf '{\n  "state": "%s",\n  "source": "%s",\n  "http_status": "%s",\n  "curl_exit": %s,\n  "message": "%s"\n}\n' \
            "$state" "$url" "$http_status" "$curl_exit" "$message" > "$status"

          echo "RSS sync state: $state"
          echo "$message"
          echo "## Substack main RSS refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "- State: $state" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTTP status: $http_status" >> "$GITHUB_STEP_SUMMARY"
          echo "- curl exit: $curl_exit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Message: $message" >> "$GITHUB_STEP_SUMMARY"

          if [ "$state" != 'ok' ]; then
            echo "::warning::$message"
          fi

      - name: Commit changed snapshot or status
        shell: bash
        run: |
          if git diff --quiet -- resource/substack-main-feed.rss resource/substack-main-feed.status.json && [ -z "$(git status --porcelain -- resource/substack-main-feed.rss resource/substack-main-feed.status.json)" ]; then
            echo 'No RSS or status changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resource/substack-main-feed.rss resource/substack-main-feed.status.json 2>/dev/null || true
          git commit -m 'Refresh Substack main RSS snapshot' || exit 0
          git push
