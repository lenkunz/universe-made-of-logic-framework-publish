name: Refresh Substack Bits RSS

on:
  push:
    paths:
      - 'bits/**'
      - 'source/**'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-substack-bits-rss
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and validate Substack podcast RSS
        id: rss
        shell: bash
        run: |
          mkdir -p resource

          url='https://api.substack.com/feed/podcast/10455398/s/443918.rss'
          tmp='resource/substack-bits-podcast.rss.tmp'
          target='resource/substack-bits-podcast.rss'
          status_file='resource/substack-bits-podcast.status.json'

          rm -f "$tmp"

          echo "Fetching $url"
          http_code=$(curl --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            --retry 2 --retry-delay 2 \
            --user-agent 'Mozilla/5.0 (compatible; universe-made-of-logic-rss-sync/1.0)' \
            --output "$tmp" \
            --write-out '%{http_code}' \
            "$url")
          curl_exit=$?

          echo "curl exit code: $curl_exit"
          echo "HTTP status: $http_code"

          fetch_ok=false
          reason=''

          if [ "$curl_exit" -ne 0 ]; then
            reason="curl transport error (exit $curl_exit)"
          elif [ "$http_code" != '200' ]; then
            reason="HTTP $http_code"
          elif [ ! -s "$tmp" ]; then
            reason='empty response body'
          else
            python - "$tmp" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          try:
              root = ET.parse(path).getroot()
          except Exception as exc:
              print(f'RSS validation failed: {exc}')
              raise SystemExit(1)

          tag = root.tag.lower()
          if not (tag.endswith('rss') or tag.endswith('feed')):
              print(f'RSS validation failed: unexpected root tag {root.tag!r}')
              raise SystemExit(1)

          print(f'RSS validation passed: root={root.tag}')
          PY
            validation_exit=$?
            if [ "$validation_exit" -eq 0 ]; then
              fetch_ok=true
            else
              reason='response was not valid RSS/Atom XML'
            fi
          fi

          if [ "$fetch_ok" = true ]; then
            mv "$tmp" "$target"
            cat > "$status_file" <<EOF
          {
            "state": "ok",
            "http_status": "$http_code",
            "snapshot": "$target",
            "message": "Latest fetch succeeded and passed XML validation."
          }
          EOF
            echo 'updated=true' >> "$GITHUB_OUTPUT"
            echo 'state=ok' >> "$GITHUB_OUTPUT"
            echo '### Substack Bits RSS refresh' >> "$GITHUB_STEP_SUMMARY"
            echo '- Result: success' >> "$GITHUB_STEP_SUMMARY"
            echo "- HTTP status: $http_code" >> "$GITHUB_STEP_SUMMARY"
            echo "- Snapshot: $target" >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f "$tmp"
            snapshot_state='no previous snapshot available'
            if [ -s "$target" ]; then
              snapshot_state='previous good snapshot preserved'
            fi
            cat > "$status_file" <<EOF
          {
            "state": "fetch-failed",
            "http_status": "$http_code",
            "snapshot": "$target",
            "message": "$reason; $snapshot_state."
          }
          EOF
            echo 'updated=false' >> "$GITHUB_OUTPUT"
            echo 'state=fetch-failed' >> "$GITHUB_OUTPUT"
            echo "::warning::Substack Bits RSS refresh was not applied: $reason. $snapshot_state."
            echo '### Substack Bits RSS refresh' >> "$GITHUB_STEP_SUMMARY"
            echo '- Result: fetch not applied' >> "$GITHUB_STEP_SUMMARY"
            echo "- Reason: $reason" >> "$GITHUB_STEP_SUMMARY"
            echo "- HTTP status: $http_code" >> "$GITHUB_STEP_SUMMARY"
            echo "- Snapshot handling: $snapshot_state" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit RSS state when changed
        shell: bash
        run: |
          if git diff --quiet -- resource/substack-bits-podcast.rss resource/substack-bits-podcast.status.json; then
            echo 'No repository RSS state change to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add resource/substack-bits-podcast.rss resource/substack-bits-podcast.status.json
            git commit -m 'Update Substack Bits RSS sync state'
            git push
          fi
