name: Sync NotebookLM Drive

on:
  push:
    branches:
      - main
    paths:
      - "source/**"
      - "bits/**"
      - ".github/workflows/sync-notebooklm-drive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebooklm-drive-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      DRIVE_MIRROR_FOLDER_ID: "184xff-AZCE94oWyNwh826M7IYNeRReLE"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install rclone
        shell: bash
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Restore Google Drive OAuth configuration
        shell: bash
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          if [ -z "$RCLONE_CONFIG_BASE64" ]; then
            echo "Missing repository secret: RCLONE_CONFIG_BASE64"
            echo "See bits/drive-sync-setup.md for the one-time setup."
            exit 1
          fi

          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

          if ! rclone listremotes | grep -qx 'gdrive:'; then
            echo "The stored rclone config must contain a Google Drive remote named gdrive."
            exit 1
          fi

      - name: Build clean NotebookLM mirror
        shell: bash
        run: |
          set -euo pipefail

          MIRROR=".notebooklm-sync"
          rm -rf "$MIRROR"
          mkdir -p "$MIRROR/framework" "$MIRROR/bits"

          # Canonical + internal framework Markdown, preserving source/ subfolders.
          rsync -a --prune-empty-dirs \
            --include='*/' \
            --include='*.md' \
            --exclude='*' \
            source/ "$MIRROR/framework/"

          # NotebookLM-facing files for each real Bit package.
          # Work-only output, generated articles, images, and audio are deliberately excluded.
          for dir in bits/*/; do
            [ -d "$dir" ] || continue
            slug="$(basename "$dir")"
            [ "$slug" = "_template" ] && continue

            mkdir -p "$MIRROR/bits/$slug"
            for file in \
              00-manifest.md \
              01-sources-to-load.md \
              02-notebooklm-source.md \
              03-notebooklm-audio-prompt.md
            do
              if [ -f "$dir/$file" ]; then
                cp "$dir/$file" "$MIRROR/bits/$slug/$file"
              fi
            done
          done

          # Production index is useful for finding prepared Bits from Drive.
          if [ -f bits/index.md ]; then
            cp bits/index.md "$MIRROR/bits/_production-index.md"
          fi

          echo "NotebookLM mirror contents:"
          find "$MIRROR" -type f | sort

      - name: Verify Drive access
        shell: bash
        run: |
          rclone lsf gdrive: \
            --drive-root-folder-id "$DRIVE_MIRROR_FOLDER_ID" \
            --max-depth 1

      - name: Sync mirror to Google Drive
        shell: bash
        run: |
          set -euo pipefail

          rclone sync .notebooklm-sync gdrive: \
            --drive-root-folder-id "$DRIVE_MIRROR_FOLDER_ID" \
            --create-empty-src-dirs \
            --fast-list \
            --checkers 8 \
            --transfers 4 \
            --log-level INFO

      - name: Show synced Drive tree
        shell: bash
        run: |
          rclone lsf gdrive: \
            --drive-root-folder-id "$DRIVE_MIRROR_FOLDER_ID" \
            --recursive \
            --files-only | sort
